# SABEQ — local development stack.
#
#   docker compose up --build --watch     everything, with hot reload (code synced into the containers)
#   docker compose up -d postgres redis   only the databases; run the apps on the host with `pnpm dev`
#   docker compose down                   stop (add -v to also delete the database volumes)
#
# Production-like images instead of dev servers: see compose.prod.yaml.
# Ports are published on 127.0.0.1 only — nothing is reachable from the local network.

name: sabeq

x-app-env: &app-env
  APP_ENV: local
  TZ: UTC

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabeq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabeq}
      POSTGRES_DB: ${POSTGRES_DB:-sabeq}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/…; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.3-alpine3.23
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible gateway for private mentor documents (Phase 09). Hosted environments use R2 / S3.
  storage:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    command: ['posix', '/data']
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:-sabeq-local}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:-sabeq-local-secret}
      VGW_PORT: ':9000'
    ports:
      - '127.0.0.1:${STORAGE_HOST_PORT:-9000}:9000'
    volumes:
      - storagedata:/data

  # One-shot: applies pending Prisma migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    command: ['pnpm', '--filter', '@sabeq/api', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-sabeq}:${POSTGRES_PASSWORD:-sabeq}@postgres:5432/${POSTGRES_DB:-sabeq}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      NODE_ENV: development
      API_PORT: 4000
      # Browser → Next.js rewrite → API: one proxy hop, so req.ip is the real client (rate limits).
      API_TRUST_PROXY: 1
      # Service names, not localhost: containers reach each other on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sabeq}:${POSTGRES_PASSWORD:-sabeq}@postgres:5432/${POSTGRES_DB:-sabeq}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-sabeq}:${POSTGRES_PASSWORD:-sabeq}@postgres:5432/${POSTGRES_DB:-sabeq}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:9000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync+restart
          path: ./packages
          target: /app/packages
          ignore: [node_modules/, dist/]
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      target: dev
      args:
        APP: web
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/public
          target: /app/apps/web/public
        - action: sync+restart
          path: ./packages
          target: /app/packages
          ignore: [node_modules/, dist/]
        - action: rebuild
          path: ./pnpm-lock.yaml

  admin:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      target: dev
      args:
        APP: admin
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    develop:
      watch:
        - action: sync
          path: ./apps/admin/src
          target: /app/apps/admin/src
        - action: sync+restart
          path: ./packages
          target: /app/packages
          ignore: [node_modules/, dist/]
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  pgdata:
  redisdata:
  storagedata:
