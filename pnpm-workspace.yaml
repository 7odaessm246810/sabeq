packages:
  - 'apps/*'
  - 'packages/*'

# One version of every shared dependency across the monorepo.
# Apps reference these with "catalog:" instead of a version range.
catalog:
  # tooling
  typescript: 6.0.3 # pinned: typescript-eslint does not support TS 7 yet (ADR-0002)
  turbo: 2.11.7
  eslint: 10.12.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.71.1
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  prettier: 3.9.9
  vitest: 5.0.3
  husky: 9.1.7
  lint-staged: 17.6.0
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@types/node': 24.19.1
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.3.8
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # runtime (used from Phase 03 / 05 onward)
  next: 16.3.8 # 16.4.0 was released 2026-10-06; wait for patches before upgrading
  react: 19.3.0
  react-dom: 19.3.0
  express: 5.2.1
  '@types/express': 5.0.6
  tsx: 4.23.15
  helmet: 8.3.0
  cors: 2.8.6
  '@types/cors': 2.8.19
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  express-rate-limit: 8.7.1
  supertest: 7.3.1
  '@types/supertest': 7.2.1
  zod: 4.6.5
  prisma: 7.10.0 # 'latest' tag points to an 8.0 release candidate
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: 8.23.1
  '@types/pg': 8.23.1
  ioredis: 6.0.0
  '@aws-sdk/client-s3': 3.1146.0 # private document storage (S3 / R2 / local S3 gateway)

# Exact versions only — no surprise upgrades in production.
savePrefix: ''
engineStrict: true
allowBuilds:
  esbuild: true # tsx → esbuild: installs the platform binary
  '@prisma/engines': true # downloads the Prisma schema engine (migrations)
  prisma: true
